[project]
name = "facet"
version = "0.1.0"
description = "Grok-powered Discord bot by Plygon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Plygon" }]
dependencies = [
    "discord.py>=2.4.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
facet = "facet.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
